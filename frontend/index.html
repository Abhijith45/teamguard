<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111215" />
    <meta name="description" content="TeamGuard — Multi-tenant role-based access control, resource-level ABAC policies, and work management console." />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("teamguard_theme") || "dark";
          var resolved = stored === "system"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : (stored === "light" ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.setAttribute("data-theme-setting", stored);
          var metaCs = document.querySelector('meta[name="color-scheme"]');
          if (metaCs) metaCs.content = resolved;
          var metaTc = document.querySelector('meta[name="theme-color"]');
          if (metaTc) metaTc.content = resolved === "dark" ? "#111215" : "#F8FAFC";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>TeamGuard · Enterprise RBAC &amp; Work Management</title>

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
