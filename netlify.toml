# ==============================================================================
# TeamGuard Frontend - Netlify Production Deployment Configuration
# ==============================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Direct all routes to index.html for React Router / client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
