# ==============================================================================
# TeamGuard Production Container Architecture (TASK-602)
# Multi-stage hardened containers with non-root execution & network isolation
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database (Alpine)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: teamguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rbacdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - teamguard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rbacdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Hardened Express Backend API (Node 22 Alpine, Non-Root USER node)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: teamguard-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-rbacdb}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod-teamguard-access-secret-32-chars-min!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod-teamguard-refresh-secret-32-chars-min!}
      SESSION_SECRET: ${SESSION_SECRET:-prod-teamguard-session-secret-32-chars-min!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - teamguard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Static Web Distribution & Reverse Proxy (NGINX Alpine, USER nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: teamguard-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - teamguard-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

# ------------------------------------------------------------------------------
# Persistent Volume Mounts
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  teamguard-network:
    driver: bridge
